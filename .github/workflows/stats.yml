name: stats

# Refreshes assets/*.svg and data/stats.json from the GitHub GraphQL API.
# Requires the repository secret STATS_TOKEN: a classic PAT with the read:user scope.
# The default GITHUB_TOKEN cannot read private contribution counts.

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stats
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Render cards
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::STATS_TOKEN secret is not set; refusing to re-render stale data"
            exit 1
          fi
          node scripts/generate.mjs
        env:
          GH_TOKEN: ${{ secrets.STATS_TOKEN }}
          GH_LOGIN: ${{ github.repository_owner }}
      - name: Job summary
        run: |
          node -e "
            const d = require('./data/stats.json');
            const rows = [
              ['Contributions (12 months)', d.contributions12m],
              ['Merged PRs in public repos', d.mergedPRs],
              ['Active days', d.activeDays],
              ['Longest streak', d.longestStreak],
            ];
            console.log('### Stats refreshed ' + d.generatedAt + '\n\n| Metric | Value |\n| :-- | --: |\n' + rows.map(([k, v]) => '| ' + k + ' | ' + v + ' |').join('\n'));
          " >> "$GITHUB_STEP_SUMMARY"
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets data
          git diff --cached --quiet || git commit -m "chore: refresh stats"
          git push
