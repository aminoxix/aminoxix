name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Syntax
        run: node --check scripts/generate.mjs && node --check scripts/check.mjs
      - name: Public-file guard
        run: node scripts/check.mjs
      - name: Cards are reproducible from the committed snapshot
        run: |
          node scripts/generate.mjs
          git diff --exit-code -- assets data
      - name: SVGs are well-formed
        run: python3 -c "import sys, xml.dom.minidom as m; [m.parse(f) for f in sys.argv[1:]]" assets/*.svg
